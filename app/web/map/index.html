<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Maps</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="/hub/ui.css">
<style>
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 var(--font); }
#app { display:flex; height:100%; }
#panel { width:300px; flex:none; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
#panel.hide { display:none; }
#panel .head { padding:12px 12px 8px; border-bottom:1px solid var(--line); }
#search { width:100%; }
#results { max-height:220px; overflow:auto; }
#results button { appearance:none; border:0; background:none; font:inherit; color:var(--ink); text-align:left; cursor:pointer; display:block; padding:6px 8px; border-radius:var(--r); width:100%; }
#results button:hover { background:var(--chip); }
#results small { color:var(--muted); }
#scroll { overflow:auto; flex:1; padding:6px 12px 20px; }
h3 { font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; display:flex; justify-content:space-between; align-items:center; }
label.row { display:flex; align-items:center; gap:8px; padding:4px 2px; cursor:pointer; border-radius:6px; }
label.row:hover { background:var(--chip); }
label.row input { margin:0; }
label.row .dot { width:11px; height:11px; border-radius:50%; flex:none; border:1.5px solid rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.25); }
label.row .dot.line { border-radius:2px; height:4px; border:0; box-shadow:none; }
label.row .name { flex:1; }
label.row .n { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.grp { font-weight:600; margin:10px 0 2px; display:flex; justify-content:space-between; }
.grp .linkbtn { font-size:12px; font-weight:400; }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.btn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.pin { display:flex; gap:6px; align-items:center; padding:4px 2px; }
.pin .go { flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pin .go:hover { text-decoration:underline; }
.pin .x { appearance:none; border:0; background:none; cursor:pointer; color:var(--muted); padding:0 4px; font:inherit; }
.note { color:var(--muted); font-size:12.5px; }
#mapwrap { flex:1; position:relative; min-width:0; }
#map { position:absolute; inset:0; }
#toggle { position:absolute; top:10px; left:10px; z-index:3; background:var(--card); color:var(--ink); }
/* Road / Satellite / Hybrid: one row of buttons beside the panel toggle, shown only when the pack has photos */
#views { position:absolute; top:10px; left:56px; z-index:3; display:flex; background:var(--card); border-radius:var(--r); box-shadow:0 1px 3px rgba(0,0,0,.2); }
#views .btn { border-radius:0; margin-left:-1px; }
#views .btn:first-child { border-radius:var(--r) 0 0 var(--r); margin-left:0; }
#views .btn:last-child { border-radius:0 var(--r) var(--r) 0; }
#views .btn.on, #views .btn.on:hover { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); position:relative; }
#coords { position:absolute; left:10px; bottom:30px; z-index:3; background:var(--card); color:var(--ink); padding:4px 8px; border-radius:var(--r); font:12px var(--mono); box-shadow:0 1px 3px rgba(0,0,0,.2); }
#hint .btn { margin-left: 8px; padding: 2px 10px; color: inherit; border-color: currentColor; }
#hint { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:3; background:var(--ink); color:var(--bg); padding:7px 12px; border-radius:8px; font-size:13px; display:none; }
#pinform { position:absolute; z-index:4; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; box-shadow:0 4px 18px rgba(0,0,0,.25); display:none; width:230px; }
#pinform input { width:100%; margin:6px 0; }
.maplibregl-popup-content { font:13px/1.45 -apple-system, system-ui, sans-serif; background:var(--card); color:var(--ink); padding:10px 12px; max-width:280px; }
.maplibregl-popup-content b { font-size:14px; }
.maplibregl-popup-content .k { color:var(--muted); }
.maplibregl-popup-content .c { font:12px var(--mono); color:var(--muted); margin-top:4px; }
#err { color:var(--crit); }
.rec { width:30px; height:30px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:16px; cursor:pointer; box-shadow:0 0 0 3px var(--ring,var(--muted)), 0 2px 5px rgba(0,0,0,.4); }
.rec.muted { border:2px dashed var(--muted); box-shadow:0 2px 5px rgba(0,0,0,.4); }
.maplibregl-popup-content .pill { margin:3px 0; }
.maplibregl-popup-content .ob { appearance:none; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer; padding:5px 10px; border-radius:var(--r); display:inline-block; margin-top:6px; }
.ico { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:13px; flex:none; background:var(--card); box-shadow:0 0 0 2px var(--c), 0 1px 2px rgba(0,0,0,.3); }
.nr { display:grid; grid-template-columns:22px 1fr auto 22px; gap:8px; align-items:center; padding:5px 2px; cursor:pointer; border-radius:6px; }
.nr:hover { background:var(--chip); }
.nr .t { min-width:0; } .nr .t b { display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nr .t small { color:var(--muted); font-size:12px; }
.nr .d { font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; }
.nr .arr { font-size:16px; color:var(--accent); text-align:center; display:inline-block; }
/* popup tails take the card color */
[class*="-anchor-top"] .maplibregl-popup-tip { border-bottom-color: var(--card); }
[class*="-anchor-bottom"] .maplibregl-popup-tip { border-top-color: var(--card); }
[class*="-anchor-left"] .maplibregl-popup-tip { border-right-color: var(--card); }
[class*="-anchor-right"] .maplibregl-popup-tip { border-left-color: var(--card); }
@media print {
  #panel, #toggle, #views, .btn, #hint, #pinform, #coords, .maplibregl-ctrl-top-right { display: none !important; }
  #app { display: block; height: 100%; }
  #mapwrap { position: fixed; inset: 0; width: 100vw; height: 100vh; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="head">
      <label class="sr-only" for="search">Search places, springs and hospitals</label>
      <input id="search" placeholder="Search places, springs, hospitals…" autocomplete="off">
      <div id="results"></div>
    </div>
    <div id="scroll">
      <h3>Tools</h3>
      <div class="tools">
        <button class="btn ghost" id="pinBtn" type="button">Drop a pin</button>
        <button class="btn ghost" id="measureBtn" type="button">Measure</button>
        <button class="btn ghost" id="homeBtn" type="button">Go home</button>
        <button class="btn ghost" id="texasBtn" type="button">Whole region</button>
        <button class="btn ghost" id="printBtn" type="button">Print map</button>
      </div>
      <div id="measureOut" class="note" style="margin-top:6px"></div>

      <h3>My places <button class="linkbtn" id="openPlace" type="button">Open My Place</button></h3>
      <div id="pins"><div class="note">Your saved places show here.</div></div>

      <h3>Near me <button class="linkbtn" id="nearRefresh" type="button">Update</button></h3>
      <div class="note" id="nearFrom">From the map center. Drop a pin named “Home” to measure from there.</div>
      <div id="near"></div>

      <h3>Survival layers <button class="linkbtn" id="allOff" type="button">All off</button></h3>
      <div id="overlays"><div class="note">Loading layers…</div></div>

      <h3>Base map</h3>
      <div id="base"></div>

      <h3>Map file</h3>
      <label class="sr-only" for="pick">Map file</label><select id="pick"></select> <span id="err" role="status"></span>
    </div>
  </aside>
  <div id="mapwrap">
    <button class="btn ghost" id="toggle" type="button" aria-label="Show or hide the panel" title="Show or hide the panel">☰</button>
    <div id="views" role="group" aria-label="Map view" hidden>
      <button class="btn ghost" type="button" data-view="road" aria-pressed="false" title="Road map">Road</button>
      <button class="btn ghost" type="button" data-view="satellite" aria-pressed="false" title="Aerial photos">Satellite</button>
      <button class="btn ghost" type="button" data-view="hybrid" aria-pressed="false" title="Aerial photos with roads and names">Hybrid</button>
    </div>
    <div id="map"></div>
    <div id="coords">Move over the map</div>
    <div id="hint"></div>
    <div id="pinform"><b>Save this place</b><label class="sr-only" for="pinName">Place name</label><input id="pinName" placeholder="e.g. Home, rally point, creek access">
      <label class="sr-only" for="pinType">Type of record</label><select id="pinType" style="width:100%;margin-bottom:6px"></select><div class="tools"><button class="btn" id="pinSave" type="button">Save</button><button class="btn ghost" id="pinCancel" type="button">Cancel</button></div></div>
  </div>
</div>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<script src="lib/basemaps.js"></script>
<script src="lib/maplibre-contour.min.js"></script>
<script src="/hub/og.js"></script>
<script src="/hub/ui.js"></script>
<script>
"use strict";
const $ = UI.$;
const el = UI.el;
const store = { get: (k, d) => UI.store.get("map:" + k, d), set: (k, v) => UI.store.set("map:" + k, v) };
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const base = location.origin + location.pathname.replace(/[^/]*$/, "");
const START = [-98.58, 39.83];   // middle of the lower 48, used until you have a Home place or a saved view
const TEXAS = [[-106.65, 25.84], [-93.51, 36.5]];
// the active region: built-in files, or a pack from /packs/<slug>/ (another state, possibly on an external drive)
let R = { slug: "", ov: "overlays/", terr: "terrain/", tb: [-98.6, 32.0, -95.8, 34.0], tz: 0, sat: null };
const GROUP_COLORS = { "Water": "#1e88e5", "Medical": "#e53935", "Emergency": "#fb8c00", "Food & supplies": "#43a047",
  "Fuel & power": "#f9a825", "Shelter & outdoors": "#795548", "Community": "#8e24aa", "Comms": "#00acc1", "Transport": "#546e7a" };

// ---------- icons (emoji drawn into map images, so no icon files are needed) ----------
const ICON = { railroads:"🛤️", rail_old:"🛤️", springs:"💧", wells:"🪣", drinking_water:"🚰", water_towers:"🗼", dams:"🧱", boat_ramps:"🛶", gov_wells:"🪣", pws_wells:"🚰", pws_intakes:"🌊", gauges:"📏", meat_plants:"🥩", state_parks:"🌲",
  hospitals:"🏥", clinics:"🩺", pharmacies:"💊", vets:"🐾", fire:"🚒", police:"🚓", shelters:"⛺", aed:"❤️",
  grocery:"🛒", hardware:"🔧", farms:"🌾", fuel:"⛽", substations:"⚡", power_plants:"🏭", camping:"🏕️", caves:"🕳️",
  peaks:"⛰️", hunting_fishing:"🎣", schools:"🏫", worship:"⛪", community:"🏛️", towers:"📡", airports:"✈️", rail:"🚉" };
const GROUP_ICON = { "Water":"💧", "Medical":"➕", "Emergency":"🚨", "Food & supplies":"🛒", "Fuel & power":"⚡",
  "Shelter & outdoors":"🏕️", "Community":"🏛️", "Comms":"📡", "Transport":"🚉" };
const iconFor = o => ICON[o.id] || GROUP_ICON[o.group] || "📍";
function iconImage(o) {
  const S = 56, c = document.createElement("canvas"); c.width = c.height = S; const g = c.getContext("2d");
  g.beginPath(); g.arc(S/2, S/2, S/2 - 3, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill();
  g.lineWidth = 5; g.strokeStyle = colorFor(o); g.stroke();
  g.font = "28px 'Apple Color Emoji', system-ui"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(iconFor(o), S/2, S/2 + 2);
  return g.getImageData(0, 0, S, S);
}

// ---------- base map toggles (groups of basemap layers, plus extra land layers) ----------
const BASE = [
  { id: "hills", label: "Hill shading (terrain)", test: id => id === "x_hills", on: true },
  { id: "contours", label: "Elevation lines (feet)", test: id => /^x_contour/.test(id), on: true },
  { id: "water", label: "Lakes, rivers, streams", test: id => /^water($|_stream|_river)/.test(id), on: true },
  { id: "waterlabels", label: "Water names", test: id => /^water_(label|waterway)/.test(id), on: true },
  { id: "forest", label: "Forests and woods", test: id => id === "x_forest", on: true },
  { id: "farm", label: "Farmland and orchards", test: id => id === "x_farm", on: true },
  { id: "land", label: "Parks and land use", test: id => /^(landcover|landuse_)/.test(id), on: true },
  { id: "buildings", label: "Buildings", test: id => /^(buildings|address_label)$/.test(id), on: true },
  { id: "trails", label: "Trails and paths", test: id => /^roads_(tunnels_|bridges_)?other/.test(id), on: true },
  { id: "roadnames", label: "Road names", test: id => /^roads_(labels|oneway)/.test(id), on: true },
  { id: "places", label: "Town names", test: id => /^places_/.test(id), on: true },
  { id: "pois", label: "Basic map icons", test: id => id === "pois", on: true },
];
const baseState = store.get("base", Object.fromEntries(BASE.map(b => [b.id, b.on])));

// ---------- map view: Road, Satellite (aerial photos) or Hybrid (photos with roads and names on top) ----------
const VIEWS = ["road", "satellite", "hybrid"];
let viewPick = store.get("mapView", "road");
if (!VIEWS.includes(viewPick)) viewPick = "road";
let overSat = new Set();   // ids of this region's road-map layers that sit above the photos
const activeView = () => (R.sat ? viewPick : "road");
// Should a road-map layer show in this view? Layers under the photos always do (they fill gaps where there
// are no photos). Layers above them hide in Satellite; in Hybrid only lines and labels stay.
function viewShows(view, type, aboveSat) {
  if (!aboveSat || view === "road") return true;
  if (view === "satellite") return false;
  return type === "line" || type === "symbol";
}
function layerShown(l) {
  if (/^x_sat/.test(l.id)) return activeView() !== "road";
  const g = BASE.find(b => b.test(baseId(l.id)));
  return (!g || (g.id in baseState ? !!baseState[g.id] : g.on)) && viewShows(activeView(), l.type, overSat.has(l.id));
}
function applyVisibility() {
  if (!map || !map.getStyle()) return;
  for (const l of map.getStyle().layers) {
    const want = layerShown(l) ? "visible" : "none";
    if ((l.layout && l.layout.visibility || "visible") !== want) map.setLayoutProperty(l.id, "visibility", want);
  }
}
function showViews() {
  $("#views").hidden = !R.sat;
  document.querySelectorAll("#views .btn").forEach(b => {
    const on = b.dataset.view === activeView();
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
document.querySelectorAll("#views .btn").forEach(b => b.onclick = () => {
  viewPick = b.dataset.view; store.set("mapView", viewPick); showViews(); applyVisibility();
});

// ---------- tiles inside one PMTiles file (terrain.pmtiles, satellite.pmtiles), read with Range requests ----------
// One reader per file, shared by MapLibre's pmtiles:// sources and the elevation-line maker.
function pmFor(url) {
  let p = protocol.get(url);
  if (!p) { p = new pmtiles.PMTiles(url); protocol.add(p); }
  return p;
}
function zxyOf(url) {
  const m = /\/(\d+)\/(\d+)\/(\d+)(?:\.\w+)?(?:[?#].*)?$/.exec(url);
  return m ? [+m[1], +m[2], +m[3]] : null;
}
// The tile address pattern for a pack's terrain: loose z/x/y.png files in a folder (older packs),
// or one terrain.pmtiles file (newer packs). packUrl is the pack's full address, ending in "/".
function terrainTiles(part, packUrl) {
  if (part && part.file) return { file: packUrl + part.file, tiles: "pmtiles://" + packUrl + part.file + "/{z}/{x}/{y}",
    type: part.format === "png" ? "image/png" : "image/webp" };
  return { file: "", tiles: packUrl + ((part && part.dir) || "terrain") + "/{z}/{x}/{y}.png", type: "image/png" };
}
// What to draw from satellite.pmtiles. The whole region has photos up to "maxzoom"; some areas (around home)
// go sharper, up to their own zoom. Each sharp area becomes its own source limited to its box, so everywhere
// else MapLibre just enlarges the last real photo instead of asking for tiles that are not there.
function satPlan(part, header, meta, url) {
  const off = (meta && meta.offgrid_sat) || {};
  const top = header.maxZoom;
  const maxzoom = Math.min(top, part.maxzoom != null ? part.maxzoom : off.maxzoom != null ? off.maxzoom : top);
  const sharpest = Math.min(top, part.detail_maxzoom != null ? part.detail_maxzoom : top);
  const okBox = b => b && b.length === 4 && b.every(isFinite) && b[0] < b[2] && b[1] < b[3];
  const hb = [header.minLon, header.minLat, header.maxLon, header.maxLat];
  const detail = [];
  for (const d of off.detail || []) {
    const [box, z] = String(d).split(":"), b = box.split(",").map(Number), dz = Math.min(+z, sharpest);
    if (okBox(b) && dz > maxzoom) detail.push({ bounds: b, minzoom: maxzoom + 1, maxzoom: dz });
  }
  return { tiles: "pmtiles://" + url + "/{z}/{x}/{y}", minzoom: header.minZoom || 0, maxzoom, detail,
    bounds: okBox(hb) ? hb : okBox(off.bbox) ? off.bbox : null,
    attribution: part.attribution || (meta && meta.attribution) || "USGS The National Map: Imagery" };
}
async function satInfo(part, packUrl) {
  if (!part || !part.file || !window.pmtiles) return null;
  const url = packUrl + part.file, pm = pmFor(url);
  try {
    const h = await pm.getHeader();   // a file that is still downloading has a blank header and fails here
    if (h.tileType !== 3 && h.tileType !== 2 && h.tileType !== 4) return null;   // jpeg, png or webp photos only
    const meta = await pm.getMetadata().catch(() => ({}));
    return satPlan(part, h, meta, url);
  } catch { return null; }
}
function satSources(sat) {
  const src = { x_sat: { type: "raster", tiles: [sat.tiles], tileSize: 256, minzoom: sat.minzoom, maxzoom: sat.maxzoom, attribution: sat.attribution } };
  if (sat.bounds) src.x_sat.bounds = sat.bounds;
  sat.detail.forEach((d, i) => { src["x_sat_" + i] = { type: "raster", tiles: [sat.tiles], tileSize: 256, minzoom: d.minzoom, maxzoom: d.maxzoom, bounds: d.bounds, attribution: sat.attribution }; });
  return src;
}
const satLayers = sat => ["x_sat", ...sat.detail.map((d, i) => "x_sat_" + i)].map((id, i) => ({ id, type: "raster", source: id,
  minzoom: i ? sat.detail[i - 1].minzoom : 0, paint: { "raster-fade-duration": 0 } }));

function extraLand() {
  return [
    { id: "x_forest", type: "fill", source: "protomaps", "source-layer": "landuse",
      filter: ["in", ["get", "kind"], ["literal", ["wood", "forest", "nature_reserve", "national_park", "protected_area"]]],
      paint: { "fill-color": "#9cc59a", "fill-opacity": 0.55 } },
    { id: "x_farm", type: "fill", source: "protomaps", "source-layer": "landuse",
      filter: ["in", ["get", "kind"], ["literal", ["farmland", "farmyard", "orchard", "vineyard", "meadow", "allotments", "plant_nursery", "greenhouse_horticulture"]]],
      paint: { "fill-color": "#e8dca0", "fill-opacity": 0.5 } },
  ];
}

const baseId = id => id.split("__")[0];   // a neighbour state's layers carry "__<state>" after the usual name
function style(file) {
  const layers = basemaps.layers("protomaps", basemaps.namedFlavor("light"), { lang: "en" });
  const at = layers.findIndex(l => l.id === "water");
  layers.splice(at, 0, ...extraLand());
  const sources = { protomaps: { type: "vector", url: "pmtiles://" + (file.startsWith("/") ? location.origin + file : base + file), attribution: "&copy; OpenStreetMap contributors" } };
  // Every other state you have is drawn too, so the map does not go blank at a state line.
  // Hills, elevation lines and survival layers still come from the region picked under "Map file".
  const under = [];
  for (const p of Object.values(PACKS)) {
    if (p.slug === R.slug || !(p.parts && p.parts.basemap)) continue;
    const src = "pm_" + p.slug;
    sources[src] = { type: "vector", url: "pmtiles://" + location.origin + "/packs/" + p.slug + "/" + (p.parts.basemap.file || "basemap.pmtiles"), attribution: "&copy; OpenStreetMap contributors" };
    const more = basemaps.layers(src, basemaps.namedFlavor("light"), { lang: "en" }).filter(l => l.type !== "background");
    const w = more.findIndex(l => l.id === "water");
    more.splice(w < 0 ? 0 : w, 0, ...extraLand().map(l => Object.assign({}, l, { source: src })));
    more.forEach(l => { l.id += "__" + p.slug; });
    under.push(...more);
  }
  const bg = layers.findIndex(l => l.type === "background");
  layers.splice(bg + 1, 0, ...under);        // neighbours sit under the picked region
  // Aerial photos go right under the water layer: above land colors (which still show where there are no
  // photos), under water, roads and names. Hill shading and elevation lines are added later, also right
  // under the water layer, so they land on top of the photos.
  overSat = new Set();
  if (R.sat) {
    Object.assign(sources, satSources(R.sat));
    const sat = satLayers(R.sat), w = layers.findIndex(l => l.id === "water");
    layers.splice(w, 0, ...sat);
    layers.slice(w + sat.length).forEach(l => { if (l.source === "protomaps") overSat.add(l.id); });
  }
  for (const l of layers) if (!layerShown(l)) l.layout = Object.assign({}, l.layout, { visibility: "none" });
  return { version: 8, glyphs: base + "fonts/{fontstack}/{range}.pbf", sprite: base + "sprites/light", sources, layers };
}

function buildBaseToggles() {
  const box = $("#base"); box.replaceChildren();
  BASE.forEach(b => {
    const cb = el("input", { type: "checkbox", checked: !!baseState[b.id] });
    cb.onchange = () => {
      baseState[b.id] = cb.checked; store.set("base", baseState);

// ---------- terrain: hill shading and elevation lines from local elevation tiles ----------
let dem = null, terrainZ = 0;
async function findTerrain() {
  if (R.tz) return R.tz;   // packs say their terrain zoom in pack.json
  for (const z of [13, 12]) {
    const n = 2 ** z, x = Math.floor((view.center[0] + 180) / 360 * n), r = view.center[1] * Math.PI / 180;
    const y = Math.floor((1 - Math.asinh(Math.tan(r)) / Math.PI) / 2 * n);
    try { if ((await fetch("terrain/" + z + "/" + x + "/" + y + ".png", { method: "HEAD" })).ok) return z; } catch {}
  }
  return 0;
}
// Elevation lines come from maplibre-contour, which fetches its own tiles with plain fetch(). That can't read
// inside a PMTiles file, so for packed terrain it runs on this page (worker: false) and its tile getter is
// swapped for one that reads the same PMTiles file the hill shading uses. Tiles are decoded the usual way.
function makeDem(t) {
  if (!window.mlcontour) return null;
  if (!t.file) return new mlcontour.DemSource({ url: t.tiles, encoding: "terrarium", maxzoom: terrainZ, worker: true });
  const d = new mlcontour.DemSource({ url: t.tiles, encoding: "terrarium", maxzoom: terrainZ, worker: false });
  if (!d.manager || typeof d.manager.getTile !== "function") return null;   // library changed: hill shading still works
  const pm = pmFor(t.file);
  d.manager.getTile = async (url, ac) => {
    const zxy = zxyOf(url), tile = zxy && await pm.getZxy(zxy[0], zxy[1], zxy[2], ac && ac.signal);
    if (!tile) throw new Error("No terrain tile " + url);
    return { data: new Blob([tile.data], { type: t.type }), cacheControl: tile.cacheControl, expires: tile.expires };
  };
  return d;
}
function addTerrain() {
  if (!terrainZ || map.getSource("x_dem")) return;
  const t = R.terrPart ? terrainTiles(R.terrPart, location.origin + "/packs/" + R.slug + "/")
    : { file: "", tiles: (R.terr.startsWith("/") ? location.origin + R.terr : base + R.terr) + "{z}/{x}/{y}.png" };
  const url = t.tiles;
  if (!dem && (dem = makeDem(t))) dem.setupMaplibre(maplibregl);
  map.addSource("x_dem", { type: "raster-dem", tiles: [url], encoding: "terrarium", tileSize: 256, maxzoom: terrainZ, bounds: R.tb });
  const before = map.getLayer("water") ? "water" : undefined;
  map.addLayer({ id: "x_hills", type: "hillshade", source: "x_dem",
    layout: { visibility: baseState.hills === false ? "none" : "visible" },
    paint: { "hillshade-exaggeration": 0.55, "hillshade-shadow-color": "#5b5040", "hillshade-highlight-color": "#ffffff" } }, before);
  if (!dem) return;
  map.addSource("x_contours", { type: "vector", bounds: R.tb, maxzoom: 15, tiles: [dem.contourProtocolUrl({
    multiplier: 3.28084, thresholds: { 10: [100, 500], 11: [50, 250], 12: [20, 100], 13: [10, 50], 14: [10, 50] },
    elevationKey: "ele", levelKey: "level", contourLayer: "contours" })] });
  const vis = baseState.contours === false ? "none" : "visible";
  map.addLayer({ id: "x_contour_lines", type: "line", source: "x_contours", "source-layer": "contours", minzoom: 10, layout: { visibility: vis },
    paint: { "line-color": "#8a6d3b", "line-opacity": ["match", ["get", "level"], 1, 0.6, 0.3], "line-width": ["match", ["get", "level"], 1, 1, 0.5] } }, before);
  map.addLayer({ id: "x_contour_labels", type: "symbol", source: "x_contours", "source-layer": "contours", minzoom: 12,
    filter: [">", ["get", "level"], 0], layout: { visibility: vis, "symbol-placement": "line", "text-size": 10.5,
      "text-field": ["concat", ["number-format", ["get", "ele"], {}], " ft"], "text-font": ["Noto Sans Regular"] },
    paint: { "text-color": "#6b5530", "text-halo-color": "#fff", "text-halo-width": 1.2 } });
}

// ---------- survival overlays (lazy-loaded GeoJSON) ----------
let INDEX = [];
const loaded = {};                       // id -> FeatureCollection
const overlayOn = store.get("overlays", { hospitals: true, springs: true });
function colorFor(o) { return GROUP_COLORS[o.group] || "#333"; }

function addOverlay(o) {
  const src = "ov_" + o.id;
  const add = data => {
    if (!map.getSource(src)) map.addSource(src, { type: "geojson", data, maxzoom: 14, tolerance: 0.5 });
    const c = colorFor(o);
    if (o.geom === "line") {
      if (o.id === "railroads" || o.id === "rail_old") {
        // railroad look: a solid rail with cross-ties. Old lines are brown and faded (rails may be gone).
        const old = o.id === "rail_old", rc = old ? "#8d6e63" : "#2b2b2b";
        if (!map.getLayer(src)) map.addLayer({ id: src, type: "line", source: src, layout: { "line-cap": "round" },
          paint: { "line-color": rc, "line-opacity": old ? 0.7 : 0.95, "line-width": ["interpolate", ["linear"], ["zoom"], 5, 1, 10, 2, 15, 3.5] } });
        if (!map.getLayer(src + "_label")) map.addLayer({ id: src + "_label", type: "line", source: src, minzoom: 9,
          paint: { "line-color": rc, "line-opacity": old ? 0.6 : 0.9, "line-width": ["interpolate", ["linear"], ["zoom"], 9, 5, 15, 11], "line-dasharray": [0.25, 1.6] } });
      } else if (!map.getLayer(src)) map.addLayer({ id: src, type: "line", source: src,
        paint: { "line-color": c, "line-width": ["interpolate", ["linear"], ["zoom"], 6, 0.6, 14, 2.2], "line-dasharray": [3, 2], "line-opacity": 0.9 } });
    } else {
      if (!map.hasImage("ic_" + o.id)) map.addImage("ic_" + o.id, iconImage(o), { pixelRatio: 2 });
      if (!map.getLayer(src)) map.addLayer({ id: src, type: "circle", source: src, maxzoom: 10,
        paint: { "circle-color": c, "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 2, 9.9, 3.5],
          "circle-stroke-color": "#fff", "circle-stroke-width": 0.6 } });
      if (!map.getLayer(src + "_label")) map.addLayer({ id: src + "_label", type: "symbol", source: src, minzoom: 10,
        layout: { "icon-image": "ic_" + o.id, "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.75, 15, 1.1],
          "icon-allow-overlap": ["step", ["zoom"], false, 14, true], "icon-padding": 1,
          "text-field": ["step", ["zoom"], "", 13, ["coalesce", ["get", "n"], ""]], "text-font": ["Noto Sans Medium"], "text-size": 11.5,
          "text-offset": [0, 1.3], "text-anchor": "top", "text-optional": true, "text-max-width": 9 },
        paint: { "text-color": "#1d1f1c", "text-halo-color": "#fff", "text-halo-width": 1.6 } });

    .catch(() => { $("#err").textContent = "Couldn't load " + o.label; });
}

}

}

function buildOverlayList() {

      const dot = o.geom === "line" ? el("span", { className: "dot line" }) : el("span", { className: "ico", textContent: iconFor(o) });

function onMapClick(e) {

let pins = [], pinMarkers = [], pendingPin = null, pickFor = null;

let mpts = [];
function measureData() { return { type: "FeatureCollection", features: [
  { type: "Feature", geometry: { type: "LineString", coordinates: mpts } },
  ...mpts.map(c => ({ type: "Feature", geometry: { type: "Point", coordinates: c } }))] }; }
function addMeasure(ll) {

    map.addSource("measure", { type: "geojson", data: measureData() });

    map.addLayer({ id: "measure_pts", type: "circle", source: "measure", filter: ["==", ["geometry-type"], "Point"], paint: { "circle-radius": 4, "circle-color": "#d81b60", "circle-stroke-color": "#fff", "circle-stroke-width": 1.5 } });
  } else map.getSource("measure").setData(measureData());
  let d = 0; for (let i = 1; i < mpts.length; i++) d += OG.miles(mpts[i - 1], mpts[i]);
  $("#measureOut").textContent = mpts.length > 1 ? `Distance: ${d.toFixed(2)} mi (${(d * 1.609).toFixed(2)} km). About ${Math.round(d / 3 * 60)} min walking.` : "Click the next point.";
}

// ---------- search (overlay names, pins, and town names on screen) ----------
let searchAll = null;
async function ensureAllLoaded() {
  if (searchAll) return searchAll;
  await Promise.all(INDEX.filter(o => o.geom !== "line" && !loaded[o.id]).map(o =>
    fetch(R.ov + o.id + ".geojson").then(r => r.json()).then(fc => { loaded[o.id] = fc; }).catch(() => { $("#err").textContent = "Couldn't load some layers"; })));
  searchAll = [];
  INDEX.forEach(o => (loaded[o.id]?.features || []).forEach(f => {
    if (f.properties.n && f.geometry.type === "Point") searchAll.push({ n: f.properties.n, o, c: f.geometry.coordinates, p: f.properties });
  }));
  return searchAll;
}
$("#search").oninput = UI.debounce(runSearch, 200);
async function runSearch() {
  const q = $("#search").value.trim().toLowerCase(), out = $("#results"); out.replaceChildren();
  if (q.length < 2) return;
  const hits = [];
  pins.filter(p => p.name.toLowerCase().includes(q)).forEach(p => hits.push({ n: p.name, sub: "My pin", c: [p.lng, p.lat] }));
  map.querySourceFeatures("protomaps", { sourceLayer: "places" }).forEach(f => {
    const n = f.properties["name:en"] || f.properties.name;
    if (n && n.toLowerCase().includes(q) && !hits.some(h => h.n === n)) hits.push({ n, sub: "Town", c: f.geometry.coordinates });
  });
  const groupHit = INDEX.find(o => o.label.toLowerCase().includes(q));
  if (groupHit) hits.push({ n: "Show all " + groupHit.label.toLowerCase(), sub: groupHit.group, layer: groupHit });
  (await ensureAllLoaded()).forEach(x => { if (hits.length < 60 && x.n.toLowerCase().includes(q)) hits.push({ n: x.n, sub: x.o.label + (x.p.ad ? " · " + x.p.ad : ""), c: x.c, x }); });
  if (!hits.length) out.append(el("div", { className: "note", textContent: "No matches." }));
  hits.slice(0, 60).forEach(h => out.append(el("button", { onclick: () => {
    if (h.layer) { setOverlay(h.layer, true); buildOverlayList(); return; }
    if (h.x && !overlayOn[h.x.o.id]) { setOverlay(h.x.o, true); buildOverlayList(); }
    map.flyTo({ center: h.c, zoom: Math.max(map.getZoom(), 14), speed: 2.5 });
    if (h.x) new maplibregl.Popup().setLngLat(h.c).setHTML(popupHTML(h.x.p, h.x.o.label, { lng: h.c[0], lat: h.c[1] })).addTo(map);
  } }, h.n + " ", el("small", { textContent: h.sub }))));
}

// ---------- near me: closest place in each category, with distance and direction ----------
const KEY_FIRST = ["springs","drinking_water","wells","gov_wells","pws_intakes","hospitals","clinics","pharmacies","fire","shelters","grocery","farms","hardware","fuel","camping","police"];
const rank = id => { const i = KEY_FIRST.indexOf(id); return i < 0 ? 99 : i; };
async function updateNear() {
  const box = $("#near"); if (!map || !INDEX.length) return;
  const home = pins.find(x => /home/i.test(x.name));
  const from = home ? [home.lng, home.lat] : map.getCenter().toArray();
  $("#nearFrom").textContent = home ? "From your pin “" + home.name + "”." : "From the map center. Drop a pin named “Home” to measure from there.";
  const on = INDEX.filter(o => o.geom !== "line" && overlayOn[o.id]);
  const list = on.length ? on : INDEX.filter(o => KEY_FIRST.includes(o.id));
  await Promise.all(list.filter(o => !loaded[o.id]).map(o => fetch(R.ov + o.id + ".geojson").then(r => r.json()).then(fc => { loaded[o.id] = fc; }).catch(() => { $("#err").textContent = "Couldn't load " + o.label; })));
  const rows = [];
  list.forEach(o => {
    let best = null, bd = 1e9;
    for (const f of loaded[o.id]?.features || []) { if (f.geometry.type !== "Point") continue;
      const c = f.geometry.coordinates; if (Math.abs(c[1] - from[1]) > 1.5 || Math.abs(c[0] - from[0]) > 1.8) continue;
      const d = OG.miles(from, c); if (d < bd) { bd = d; best = f; } }
    if (best) rows.push({ o, f: best, d: bd, b: OG.bearing(from, best.geometry.coordinates) });
  });
  rows.sort((a, b) => rank(a.o.id) - rank(b.o.id) || a.d - b.d);
  box.replaceChildren();
  if (!rows.length) { box.append(el("div", { className: "note", textContent: "Nothing within about 100 miles." })); return; }
  rows.forEach(({ o, f, d, b }) => {
    const ic = el("span", { className: "ico", textContent: iconFor(o) }); ic.style.setProperty("--c", colorFor(o));
    const arr = el("span", { className: "arr", textContent: "↑", title: Math.round(b) + "° " + OG.compass(b) }); arr.style.transform = "rotate(" + b + "deg)";
    const c = f.geometry.coordinates;
    box.append(el("div", { className: "nr", title: "Show on map", role: "button", tabindex: 0, onclick: () => {
      if (!overlayOn[o.id]) { setOverlay(o, true); buildOverlayList(); }
      map.flyTo({ center: c, zoom: Math.max(map.getZoom(), 14), speed: 2.5 });
      new maplibregl.Popup().setLngLat(c).setHTML(popupHTML(f.properties, o.label, { lng: c[0], lat: c[1] })).addTo(map);
    } }, ic, el("div", { className: "t" }, el("b", { textContent: f.properties.n || o.label }), el("small", { textContent: o.label + " · " + OG.compass(b) })),
      el("span", { className: "d", textContent: d < 10 ? d.toFixed(1) + " mi" : Math.round(d) + " mi" }), arr));
  });
}
$("#nearRefresh").onclick = updateNear;
const nearSoon = UI.debounce(updateNear, 600);

// ---------- commands from the rest of the app: #pick=<record id>, #fly=lng,lat ----------
let flyMarker, ready = false;   // ready: the map has drawn once, so commands can run. Before that they wait in the address.
function endPick() { pickFor = null; $("#hint").style.display = "none"; $("#hint").replaceChildren(); map.getCanvas().style.cursor = ""; }
function startPick(id) {
  if (mode) setMode(mode);   // leave pin or measure mode first
  pickFor = id;
  const rec = OG.db && OG.db.items.find(x => x.id === id);
  const d = $("#hint"); d.replaceChildren(
    el("span", { textContent: "Click the exact spot for " + (rec ? "“" + rec.name + "”" : "this record") + ". Zoom in first if you need to. " }),
    el("button", { className: "btn ghost", type: "button", textContent: "Cancel", onclick: () => { endPick(); UI.go("place/r=" + id); } }));
  d.style.display = "block"; map.getCanvas().style.cursor = "crosshair";
  // start somewhere useful: the old point if it has one, else Home
  const home = pins.find(p => p.rec && p.rec.fields && p.rec.fields.kind === "home");
  if (rec && rec.loc) map.jumpTo({ center: [rec.loc.lng, rec.loc.lat], zoom: Math.max(map.getZoom(), 15) });
  else if (home) map.jumpTo({ center: [home.lng, home.lat], zoom: Math.max(map.getZoom(), 13) });
  else if (map.getZoom() < 5 && R && R.tb) map.fitBounds([[R.tb[0], R.tb[1]], [R.tb[2], R.tb[3]]], { padding: 20, duration: 0 });
}
async function hashCommand() {
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  if (h.get("pack") && PACKS["pack:" + h.get("pack")] && R.slug !== h.get("pack")) { $("#pick").value = "pack:" + h.get("pack"); await useRegion($("#pick").value); }
  if (h.get("pick")) { await loadRecords(true); startPick(h.get("pick")); }
  if (h.get("fly")) { const [lng, lat] = h.get("fly").split(",").map(Number); if (isFinite(lng) && isFinite(lat)) { map.jumpTo({ center: [lng, lat], zoom: 16 });
    flyMarker && flyMarker.remove(); flyMarker = new maplibregl.Marker({ color: "#d81b60" }).setLngLat([lng, lat]).addTo(map); } }
  if (h.get("q")) { $("#search").value = h.get("q"); runSearch(); }
}
window.addEventListener("hashchange", () => ready && hashCommand());
// The shell says when this screen is shown again, or when another screen saved records: draw the saved places again.
UI.onMessage(m => { if ((m.og === "shown" || m.og === "recordsChanged") && ready) loadRecords(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && pickFor) { const id = pickFor; endPick(); UI.go("place/r=" + id); } });

// ---------- start ----------
$("#printBtn").onclick = () => print();
window.addEventListener("beforeprint", () => map && map.resize());
window.addEventListener("afterprint", () => map && map.resize());
$("#homeBtn").onclick = () => {   // your Home place from My Place (a place with kind "home", or a pin named Home)
  const h = pins.find(p => p.rec && p.rec.fields && p.rec.fields.kind === "home") || pins.find(p => /home/i.test(p.name));
  if (h && map) map.flyTo({ center: [h.lng, h.lat], zoom: 12, speed: 2.5 }); else UI.toast("Add a Home place in My Place first", true);
};
$("#texasBtn").onclick = () => map && map.fitBounds(R && R.tb ? [[R.tb[0], R.tb[1]], [R.tb[2], R.tb[3]]] : TEXAS, { padding: 20 });
$("#toggle").onclick = () => { $("#panel").classList.toggle("hide"); store.set("panelHidden", $("#panel").classList.contains("hide")); map && map.resize(); };
if (store.get("panelHidden", false)) $("#panel").classList.add("hide");
buildBaseToggles();

let PACKS = {};
async function useRegion(val) {
  const p = PACKS[val];
  if (p) {
    const b = "/packs/" + p.slug + "/", pt = p.parts || {};
    R = { slug: p.slug, ov: b + "layers/", terr: b + "terrain/", terrPart: pt.terrain || null, tb: p.bbox, tz: pt.terrain ? pt.terrain.maxzoom : -1,
      sat: await satInfo(pt.satellite, location.origin + b) };
  } else R = { slug: "", ov: "overlays/", terr: "terrain/", tb: [-98.6, 32.0, -95.8, 34.0], tz: 0, sat: null };
  showViews();
  store.set("region", val);
  Object.keys(loaded).forEach(k => delete loaded[k]);
  if (map) INDEX.forEach(o => removeOverlay(o));
  dem = null; terrainZ = 0;
  // layer list first, so the panel works even if the map itself can't start (no graphics)
  const idx = await fetch(R.ov + "index.json").then(r => r.ok ? r.json() : []).catch(() => []);
  INDEX = idx.filter(o => o.count > 0); buildOverlayList();
  try { load(p ? "/packs/" + p.slug + "/" + ((p.parts.basemap || {}).file || "basemap.pmtiles") : val); }
  catch (e) { $("#err").textContent = "The map couldn't start: " + e.message; return; }
  if (p) map.fitBounds([[p.bbox[0], p.bbox[1]], [p.bbox[2], p.bbox[3]]], { padding: 20, duration: 0 });
  if (map.loaded()) restoreOverlays();
  terrainZ = R.tz === -1 ? 0 : await findTerrain(); if (map.loaded()) addTerrain(); try { updateNear(); } catch {}
}
Promise.all([fetch("maps.json").then(r => r.json()), fetch("/api/packs").then(r => r.ok ? r.json() : []).catch(() => [])]).then(([list, packs]) => {
  const pick = $("#pick");
  packs.filter(p => p.parts && p.parts.basemap).forEach(p => { PACKS["pack:" + p.slug] = p; });
  if (!list.length && !Object.keys(PACKS).length) {   // no dead end: say what to do and offer the way there
    const e = $("#err"); e.textContent = "There is no map on this Mac yet. ";
    if (UI.inShell()) { const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Get your state's map"; b.onclick = () => UI.go("setup"); e.append(b); }
    else e.append("Run tools/packs/offgrid-pack get <your state> to download one.");
    return;
  }
  list.forEach(f => pick.add(new Option(f.replace(".pmtiles", "") + " (built in)", f)));
  Object.entries(PACKS).forEach(([k, p]) => pick.add(new Option(p.name + (p.level ? " · " + p.level : ""), k)));
  const want = new URLSearchParams(location.hash.slice(1)).get("pack");   // a link can ask for a pack: #pack=texas
  const saved = (want && PACKS["pack:" + want]) ? "pack:" + want : store.get("region", ""); pick.value = (saved && [...pick.options].some(o => o.value === saved)) ? saved : pick.options[0].value;
  pick.onchange = () => useRegion(pick.value);
  return useRegion(pick.value);
}).catch(() => { $("#err").textContent = "Open this with 'Open Maps.command' or the Off-Grid app."; });
</script>
</body>
</html>
